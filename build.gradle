plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6,)'
    id 'org.parchmentmc.librarian' version '1.+'
}

group = 'com.pancor.tacz'
version = '1.0.0'

base {
    archivesName = 'PancorJackhammer'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2024.04.14-1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level.net.minecraft', 'debug'
            property 'forge.enabledGameTestNamespaces', 'pancor'
            
            mods {
                pancor {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level.net.minecraft', 'debug'
            
            mods {
                pancor {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    
    // TaCZ зависимость
    implementation fg.deobf('czmodel:timeless_and_classics_zero:1.20.1-1.5.0:universal')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'      : 'Pancor Jackhammer',
            'Specification-Vendor'     : 'PancorTeam',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : project.jar.archiveVersion,
            'Implementation-Vendor'    : 'PancorTeam',
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Timestamped'              : System.currentTimeMillis()
        ])
    }
}

jar.finalizedBy('reobfJar')
